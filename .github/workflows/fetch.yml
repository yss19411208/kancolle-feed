name: KanColle ツイート取得

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ← これを追加（git pushに必要）

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: ツイートを取得
        run: python fetch_tweets.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}

      - name: 変更があればコミット・プッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/latest.json
          git diff --staged --quiet || git commit -m "chore: update latest tweets"
          git push
